<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DVVIA — Verified Car Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1a3a5c;
      --blue-mid: #1e4976;
      --accent: #00c896;
      --bg: #f5f6f8;
      --white: #ffffff;
      --border: #e2e6ed;
      --text: #1a2535;
      --muted: #6b7a8d;
      --light: #f0f2f5;
      --dark-card: #1c1c1e; /* Matches app dark theme */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* Navigation */
    nav { position: fixed; top: 0; width: 100%; z-index: 200; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; height: 64px; background: var(--white); border-bottom: 1px solid var(--border); }
    .nav-logo { font-size: 24px; font-weight: 800; color: var(--blue); cursor: pointer; }
    .nav-right { display: flex; align-items: center; gap: 12px; }

    /* Buttons */
    .btn { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.15s; text-decoration: none; }
    .btn-primary { background: var(--blue); color: white; }
    .btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }

    /* Page Layouts */
    .page { display: none; padding-top: 80px; min-height: 100vh; }
    .page.active { display: block; }

    /* Browse Layout (Based on Screen Shot 2026-05-14 at 1.30.08 AM.jpg) */
    .browse-container { display: flex; max-width: 1400px; margin: 0 auto; padding: 0 20px; gap: 24px; }
    .sidebar { width: 260px; flex-shrink: 0; position: sticky; top: 80px; height: fit-content; }
    .main-content { flex: 1; }

    /* Car Cards (Refined to match Screenshots) */
    .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 40px; }
    .card { background: var(--white); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .card-img { height: 220px; width: 100%; background: #000; position: relative; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; } /* Fixed path scaling */
    .card-content { padding: 16px; }
    .card-price { font-size: 24px; font-weight: 800; color: var(--blue); }
    .card-title { font-size: 15px; font-weight: 600; margin: 4px 0 12px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; background: var(--light); padding: 4px 8px; border-radius: 4px; color: var(--muted); font-weight: 500; }
    .tag-green { color: var(--accent); font-weight: 700; }

    /* Modal (Matches Screen Shot 2026-05-14 at 1.30.33 AM.jpg) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; width: 100%; max-width: 800px; border-radius: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-hero { width: 100%; height: 450px; background: #000; position: relative; }
    .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
    .modal-body { padding: 24px; }
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .spec-item { border-bottom: 1px solid var(--border); padding: 8px 0; display: flex; justify-content: space-between; }
    .condition-tag { font-weight: 700; color: #00a371; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="showPage('landing')">DVVIA</div>
  <div class="nav-right" id="nav-actions">
    <button class="btn btn-outline" onclick="showPage('login')">Log In</button>
    <a href="https://apps.apple.com/app/dvvia/id6760520915" class="btn btn-primary">Get App</a>
  </div>
</nav>

<!-- Landing Page -->
<div id="page-landing" class="page active">
  <div style="text-align: center; max-width: 800px; margin: 80px auto;">
    <h1 style="font-size: 48px; color: var(--blue);">Verified Vehicle Marketplace</h1>
    <p style="color: var(--muted); margin: 20px 0;">No scams. Every seller and listing is verified by DVVIA.</p>
    <button class="btn btn-primary" onclick="showPage('browse')">Browse Cars</button>
  </div>
</div>

<!-- Browse Page -->
<div id="page-browse" class="page">
  <div class="browse-container">
    <aside class="sidebar">
      <h3 style="font-size: 12px; text-transform: uppercase; margin-bottom: 16px;">Filters</h3>
      <!-- Filter implementation simplified for brevity -->
      <select onchange="filterListings()" id="filter-make" style="width:100%; padding:8px; margin-bottom:10px;"><option value="">All Makes</option></select>
      <div style="margin-top:20px;">
        <p style="font-size:12px; font-weight:700;">Price Range</p>
        <input type="range" style="width:100%;" min="0" max="100000" id="price-range" oninput="filterListings()">
      </div>
    </aside>
    <main class="main-content">
      <h2 id="browse-count">Loading listings...</h2>
      <div class="listings-grid" id="listings-container"></div>
    </main>
  </div>
</div>

<!-- Vehicle Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-hero" id="modal-img-container"></div>
    <div class="modal-body">
      <h2 id="modal-title" style="color: var(--blue);"></h2>
      <div class="spec-grid" id="modal-specs"></div>
      <div id="modal-conditions" style="margin-top: 20px;"></div>
      <button class="btn btn-primary" style="width:100%; padding:16px; margin-top:20px;" onclick="window.open('https://apps.apple.com/app/dvvia/id6760520915')">Schedule Viewing in App</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://dvvia-backend-1.onrender.com';
  let vehicles = [];

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');
    if(pageId === 'browse') loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(`${API_BASE}/api/vehicles`);
      const data = await res.json();
      vehicles = data.vehicles || [];
      renderListings(vehicles);
    } catch (e) {
      console.error("Load failed", e);
    }
  }

  function renderListings(list) {
    const container = document.getElementById('listings-container');
    document.getElementById('browse-count').innerText = `${list.length} verified cars available`;
    container.innerHTML = list.map(v => {
      const imgPath = v.first_photo ? `${API_BASE}/${v.first_photo.replace(/\\/g, '/')}` : '';
      return `
        <div class="card" onclick="openVehicle(${v.id})">
          <div class="card-img"><img src="${imgPath}" alt="Car"></div>
          <div class="card-content">
            <div class="card-price">$${v.price.toLocaleString()}</div>
            <div class="card-title">${v.year} ${v.make} ${v.model}</div>
            <div class="card-tags">
              <span class="tag">${v.mileage.toLocaleString()} mi</span>
              <span class="tag">${v.transmission}</span>
              <span class="tag">${v.title_status}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function openVehicle(id) {
    const v = vehicles.find(item => item.id === id);
    if(!v) return;
    
    document.getElementById('modal-title').innerText = `${v.year} ${v.make} ${v.model}`;
    const imgPath = v.first_photo ? `${API_BASE}/${v.first_photo.replace(/\\/g, '/')}` : '';
    document.getElementById('modal-img-container').innerHTML = `<img src="${imgPath}">`;
    
    document.getElementById('modal-specs').innerHTML = `
      <div class="spec-item"><span>Price</span><strong>$${v.price.toLocaleString()}</strong></div>
      <div class="spec-item"><span>Mileage</span><strong>${v.mileage.toLocaleString()} mi</strong></div>
      <div class="spec-item"><span>Transmission</span><strong>${v.transmission}</strong></div>
      <div class="spec-item"><span>VIN</span><strong>${v.vin}</strong></div>
    `;

    document.getElementById('modal-conditions').innerHTML = `
      <h3>Condition Report</h3>
      <div class="spec-grid">
        <div class="spec-item"><span>Exterior</span><span class="condition-tag">${v.condition_exterior}</span></div>
        <div class="spec-item"><span>Interior</span><span class="condition-tag">${v.condition_interior}</span></div>
      </div>
    `;

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal(e) {
    if(e.target.id === 'modal-overlay') document.getElementById('modal-overlay').classList.remove('open');
  }
</script>
</body>
</html>
